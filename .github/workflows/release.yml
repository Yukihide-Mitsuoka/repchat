# Release automation (REL-001/010/020): release-please derives SemVer + changelog from
# Conventional Commits; on tag, gates run and SBOM is attached to the GitHub Release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./scripts/actions/release-please
        id: release
        with:
          # TEMPLATE: set release-type (node, python, go, rust, simple, ...)
          release-type: simple

  release-gates:
    # REL-020 — runs only when a release was actually cut
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach assets to the release
      id-token: write      # SLSA provenance signing
      attestations: write  # SLSA provenance storage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./scripts/actions/release-gates
      # TEMPLATE: add artifact publishing (registry push, package publish) here;
      # for container images, prefer cosign keyless signing — see docs/deployment/.
