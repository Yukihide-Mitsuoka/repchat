# AI review on every PR — runs the same checklist agents use for self-review.
# SAFE DEFAULT: disabled until you set repository variable ENABLE_AI_REVIEW=true and
# secret ANTHROPIC_API_KEY. This is a *supplement* to human review, not a replacement
# (.ai/workflow.md: AI-generated changes still require human review before merge).
name: AI Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.ENABLE_AI_REVIEW == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./scripts/actions/ai-review
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pull-request-number: ${{ github.event.pull_request.number }}
